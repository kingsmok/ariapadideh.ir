{% extends 'base.html' %}

{% block title %}بازیابی رمز عبور | {{ site_settings.general_site_name or 'رهسا دیو' }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card" style="padding:2.5rem 2rem;">
                    <div class="text-center mb-4">
                        <div style="font-size:3.5rem; line-height:1; margin-bottom:1rem;" aria-hidden="true">🔐</div>
                        <h1 class="text-white" style="font-size:1.5rem; font-weight:900; margin-bottom:0.5rem;">
                            بازیابی رمز عبور
                        </h1>
                        <p class="text-muted" style="font-size:0.9rem;">
                            ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.
                        </p>
                    </div>

                    <form method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="email" class="form-label text-white" style="font-size:0.9rem;">ایمیل</label>
                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control form-control-rahsa"
                                   required
                                   placeholder="example@email.com"
                                   autocomplete="email"
                                   dir="ltr">
                        </div>
                        <button type="submit" class="btn-rahsa-cta w-100" style="padding:0.85rem;">
                            <span aria-hidden="true">📧</span>
                            <span>ارسال لینک بازیابی</span>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('user.login') }}" class="text-muted" style="font-size:0.85rem; text-decoration:none;">
                            <span aria-hidden="true">←</span> بازگشت به صفحه ورود
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
