{% extends 'base.html' %}

{% block title %}تغییر رمز عبور | {{ site_settings.general_site_name or 'رهسا دیو' }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width:540px;">

        <div class="d-flex align-items-center gap-2 mb-4 flex-wrap">
            <a href="{{ url_for('user.profile') }}" class="text-muted" style="text-decoration:none; font-size:0.9rem;">پروفایل</a>
            <span class="text-muted">/</span>
            <span class="text-white font-bold">تغییر رمز عبور</span>
        </div>

        <div class="glass-card" style="padding:2rem;">
            <h1 class="text-white" style="font-size:1.3rem; font-weight:800; margin:0 0 1rem;">🔑 تغییر رمز عبور</h1>
            <p class="text-muted" style="font-size:0.85rem; margin-bottom:1.5rem;">
                برای امنیت بیشتر، رمز فعلی خود را وارد کنید.
            </p>

                <form action="{{ url_for('user.change_password') }}" method="POST" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

                <div class="mb-3">
                    <label for="current_password" class="form-label-rahsa">رمز عبور فعلی</label>
                    <input type="password" id="current_password" name="current_password" class="form-control-rahsa"
                           required autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label-rahsa">رمز عبور جدید</label>
                    <input type="password" id="new_password" name="new_password" class="form-control-rahsa"
                           required minlength="8" autocomplete="new-password">
                    <small class="text-muted">حداقل ۸ کاراکتر.</small>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label-rahsa">تکرار رمز عبور جدید</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control-rahsa"
                           required minlength="8" autocomplete="new-password">
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn-rahsa-cta">
                        <span>تغییر رمز</span>
                        <span aria-hidden="true">✓</span>
                    </button>
                    <a href="{{ url_for('user.profile') }}" class="btn-rahsa-outline">انصراف</a>
                </div>
            </form>
        </div>

    </div>
</section>
{% endblock %}
