{% extends 'base.html' %}

{% block title %}لغو سفارش #{{ order.order_number }} | {{ site_settings.general_site_name or 'رهسا دیو' }}{% endblock %}

{% block content %}
<section class="section" style="display:flex; align-items:center; justify-content:center; min-height:70vh;">
    <div class="container">
        <div class="glass-card" style="max-width:540px; margin:0 auto; padding:2rem;">
            <div class="empty-state-icon mx-auto" style="margin-bottom:1rem;" aria-hidden="true">⚠️</div>
            <h1 class="text-white" style="font-size:1.3rem; font-weight:800; margin:0 0 0.5rem; text-align:center;">لغو سفارش</h1>
            <p class="text-muted" style="font-size:0.9rem; text-align:center; margin-bottom:1.5rem;">
                آیا از لغو سفارش <span class="text-yellow font-bold">#{{ order.order_number }}</span> مطمئن هستید؟
                این عمل قابل بازگشت نیست.
            </p>

            <form action="{{ request.path }}" method="POST" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

                <div class="mb-3">
                    <label for="reason" class="form-label-rahsa">دلیل لغو (اختیاری)</label>
                    <textarea id="reason" name="reason" class="form-control-rahsa" rows="3"
                              placeholder="دلیل لغو سفارش را بنویسید..."></textarea>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn-rahsa-cta" style="background:var(--accent-danger);">
                        <span>بله، لغو شود</span>
                        <span aria-hidden="true">✕</span>
                    </button>
                    <a href="{{ url_for('user.order_detail', order_id=order.id) }}" class="btn-rahsa-outline">انصراف</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
