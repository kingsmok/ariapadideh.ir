<!-- Site Header — Uses CSS classes from main.css (no inline styles) -->
<header class="site-navbar">
    <div class="container h-100">
        <div class="d-flex align-items-center justify-content-between h-100">

            <!-- Brand -->
            <a href="{{ url_for('public.home') }}"
               class="d-flex align-items-center gap-2 text-decoration-none"
               aria-label="{{ site_settings.general_site_name or 'رهسا دیو' }}">
                <div class="brand-badge-rahsa" aria-hidden="true">ر</div>
                <span class="text-gradient-purple-gold" style="font-size:1.35rem; font-weight:800; letter-spacing:-0.5px;">
                    {{ site_settings.general_site_name or 'رهسا دیو' }}
                </span>
            </a>

            <!-- Desktop Navigation Menu -->
            <nav class="d-none d-md-flex align-items-center gap-1" aria-label="منوی اصلی">
                <a href="{{ url_for('public.home') }}"
                   class="nav-link-item {{ 'active' if request.endpoint == 'public.home' else '' }}">
                    صفحه اصلی
                </a>

                <div class="dropdown-hover-parent">
                    <a href="{{ url_for('public.categories_list') }}"
                       class="nav-link-item {{ 'active' if request.endpoint in ['public.categories_list', 'public.category'] else '' }}"
                       aria-haspopup="true">
                        خدمات
                        <span aria-hidden="true" style="font-size:0.7em; margin-inline-start:4px;">▾</span>
                    </a>
                    <div class="dropdown-menu-glass" role="menu">
                        <a href="{{ url_for('public.categories_list') }}" role="menuitem">
                            <span aria-hidden="true">📦</span> همه خدمات
                        </a>
                        <a href="/category/web-design" role="menuitem">
                            <span aria-hidden="true">💻</span> طراحی وب‌سایت
                        </a>
                        <a href="/category/smart-bots" role="menuitem">
                            <span aria-hidden="true">🤖</span> ربات‌های هوشمند
                        </a>
                        <a href="/category/software-automation" role="menuitem">
                            <span aria-hidden="true">⚙️</span> نرم‌افزار و اتوماسیون
                        </a>
                        <a href="/category/programming-scripts" role="menuitem">
                            <span aria-hidden="true">📝</span> برنامه‌نویسی و اسکریپت
                        </a>
                    </div>
                </div>

                <a href="/#quote-section" class="nav-link-item">نمونه کارها</a>
                <a href="{{ url_for('public.compare') }}"
                   class="nav-link-item {{ 'active' if request.endpoint == 'public.compare' else '' }}">
                    قیمت‌گذاری
                </a>
                <a href="{{ url_for('public.about') }}"
                   class="nav-link-item {{ 'active' if request.endpoint == 'public.about' else '' }}">
                    درباره ما
                </a>
                <a href="{{ url_for('public.contact') }}"
                   class="nav-link-item {{ 'active' if request.endpoint == 'public.contact' else '' }}">
                    تماس با ما
                </a>
            </nav>

            <!-- Actions CTA & Mobile Hamburger -->
            <div class="d-flex align-items-center gap-3">
                <a href="/#quote-section"
                   class="btn-rahsa-cta d-none d-md-inline-flex"
                   aria-label="دریافت مشاوره رایگان">
                    <span>مشاوره رایگان</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </a>

                <button type="button"
                        class="d-md-none border-0 bg-transparent text-yellow"
                        id="open-drawer-btn"
                        style="font-size:1.8rem; cursor:pointer; padding:0.25rem 0.5rem; line-height:1;"
                        aria-label="باز کردن منوی موبایل"
                        aria-expanded="false"
                        aria-controls="mobile-drawer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>

        </div>
    </div>
</header>
<!-- Spacer to offset fixed header height -->
<div class="header-spacer" style="height:70px;" aria-hidden="true"></div>
