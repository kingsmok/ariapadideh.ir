<!-- Stitch Exact Header Component -->
<header class="site-navbar" style="background:rgba(10, 17, 40, 0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.1); position:fixed; top:0; left:0; right:0; z-index:1050; height:70px;">
    <div class="container h-100">
        <div class="d-flex align-items-center justify-content-between h-100">
            
            <!-- Brand -->
            <a href="{{ url_for('public.home') }}" class="d-flex align-items-center gap-2.5 text-decoration-none" aria-label="{{ site_settings.agency_name or 'رهسا دیو' }}">
                <div class="brand-badge-rahsa" style="width:38px; height:38px; background:linear-gradient(135deg, #6b21a8 0%, #FBB03B 100%); color:#ffffff; font-weight:900; border-radius:0.65rem; display:flex; align-items:center; justify-content:center; font-size:1.25rem;">ر</div>
                <span style="font-size:1.35rem; font-weight:800; color:#FBB03B; letter-spacing:-0.5px;">{{ site_settings.agency_name or 'رهسا دیو' }}</span>
            </a>

            <!-- Desktop Navigation Menu -->
            <nav class="d-none d-md-flex align-items-center gap-4">
                <a href="{{ url_for('public.home') }}" class="nav-link-item {{ 'active' if request.endpoint == 'public.home' else '' }}" style="color:#e2e8f0; font-weight:700; font-size:0.925rem; text-decoration:none;">صفحه اصلی</a>
                <a href="{{ url_for('public.categories_list') }}" class="nav-link-item {{ 'active' if request.endpoint in ['public.categories_list', 'public.category'] else '' }}" style="color:#e2e8f0; font-weight:700; font-size:0.925rem; text-decoration:none;">خدمات</a>
                <a href="/#quote-section" class="nav-link-item" style="color:#e2e8f0; font-weight:700; font-size:0.925rem; text-decoration:none;">نمونه کارها</a>
                <a href="{{ url_for('public.compare') }}" class="nav-link-item {{ 'active' if request.endpoint == 'public.compare' else '' }}" style="color:#e2e8f0; font-weight:700; font-size:0.925rem; text-decoration:none;">قیمت‌گذاری</a>
                <a href="{{ url_for('public.about') }}" class="nav-link-item {{ 'active' if request.endpoint == 'public.about' else '' }}" style="color:#e2e8f0; font-weight:700; font-size:0.925rem; text-decoration:none;">درباره ما</a>
                <a href="{{ url_for('public.contact') }}" class="nav-link-item {{ 'active' if request.endpoint == 'public.contact' else '' }}" style="color:#e2e8f0; font-weight:700; font-size:0.925rem; text-decoration:none;">تماس با ما</a>
            </nav>

            <!-- Actions CTA & Mobile Hamburger -->
            <div class="d-flex align-items-center gap-3">
                <a href="/#quote-section" class="btn-rahsa-cta d-none d-md-inline-flex" style="background-color:#FBB03B; color:#0A1128 !important; font-weight:800; padding:0.55rem 1.35rem; border-radius:0.6rem; text-decoration:none;" aria-label="مشاوره رایگان">
                    <span>مشاوره رایگان</span>
                    <span style="font-size:1.1rem;">🎧</span>
                </a>

                <button class="d-md-none border-0 bg-transparent text-warning" id="open-drawer-btn" style="font-size:1.8rem; cursor:pointer;" aria-label="منوی موبایل">
                    ☰
                </button>
            </div>

        </div>
    </div>
</header>
<div style="height:70px;"></div>
