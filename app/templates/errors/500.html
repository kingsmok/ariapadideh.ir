{% extends 'base.html' %}

{% block title %}خطای سرور | {{ site_settings.general_site_name or 'فلاسک پرو' }}{% endblock %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="error-content text-center">
            <div class="error-code">۵۰۰</div>
            <h1>خطای سرور</h1>
            <p>متأسفانه مشکلی در سرور ایجاد شده است. لطفاً لحظاتی دیگر مجدداً تلاش کنید.</p>
            <div class="error-actions">
                <a href="{{ url_for('public.home') }}" class="btn btn-primary">
                    <i class="fas fa-home"></i>
                    بازگشت به صفحه اصلی
                </a>
                <a href="javascript:location.reload()" class="btn btn-outline-secondary">
                    <i class="fas fa-sync-alt"></i>
                    تلاش مجدد
                </a>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 0;
}

.error-code {
    font-size: 120px;
    font-weight: 700;
    color: var(--danger);
    opacity: 0.2;
    line-height: 1;
    margin-bottom: 20px;
}

.error-content h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

.error-content p {
    color: var(--gray-600);
    margin-bottom: 30px;
}

.error-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
}
</style>
{% endblock %}
