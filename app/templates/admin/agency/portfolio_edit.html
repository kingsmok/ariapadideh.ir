{% extends 'admin/base.html' %}

{% block title %}{{ 'ویرایش نمونه‌کار' if item else 'افزودن نمونه‌کار جدید' }} - رهسا دیو{% endblock %}

{% block content %}
<div class="mb-4">
    <h2>{{ 'ویرایش نمونه‌کار' if item else 'افزودن نمونه‌کار جدید' }}</h2>
</div>

<div class="card bg-navy-card text-light p-4">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label-rahsa">عنوان پروژه</label>
                <input type="text" name="title" class="form-control-rahsa bg-dark text-light" value="{{ item.title if item else '' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label-rahsa">نام مستعار (Slug)</label>
                <input type="text" name="slug" class="form-control-rahsa bg-dark text-light" value="{{ item.slug if item else '' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label-rahsa">نام کارفرما / برند</label>
                <input type="text" name="client_name" class="form-control-rahsa bg-dark text-light" value="{{ item.client_name if item else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label-rahsa">صنعت / حوزه کاری</label>
                <input type="text" name="industry" class="form-control-rahsa bg-dark text-light" value="{{ item.industry if item else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label-rahsa">تصویر اصلی (URL)</label>
                <input type="text" name="featured_image" class="form-control-rahsa bg-dark text-light" value="{{ item.featured_image if item else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label-rahsa">لینک مستقیم پروژه (Live URL)</label>
                <input type="text" name="live_url" class="form-control-rahsa bg-dark text-light" value="{{ item.live_url if item else '' }}">
            </div>
            <div class="col-12">
                <label class="form-label-rahsa">چالش کارفرما</label>
                <textarea name="challenge" class="form-control-rahsa bg-dark text-light" rows="3">{{ item.challenge if item else '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label-rahsa">راهکار رهسا دیو</label>
                <textarea name="solution" class="form-control-rahsa bg-dark text-light" rows="3">{{ item.solution if item else '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label-rahsa">نتایج شاخص (ROI / کارهای انجام شده)</label>
                <textarea name="results_summary" class="form-control-rahsa bg-dark text-light" rows="3">{{ item.results_summary if item else '' }}</textarea>
            </div>
            <div class="col-md-6">
                <div class="form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" value="1" id="is_active" {{ 'checked' if not item or item.is_active else '' }}>
                    <label class="form-check-label" for="is_active">فعال در سایت</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-check">
                    <input type="checkbox" name="is_featured" class="form-check-input" value="1" id="is_featured" {{ 'checked' if item and item.is_featured else '' }}>
                    <label class="form-check-label" for="is_featured">نمایش ویژه در صفحه اصلی</label>
                </div>
            </div>
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-warning px-4">ذخیره اطلاعات</button>
                <a href="{{ url_for('admin.agency_portfolio') }}" class="btn btn-secondary me-2">انصراف</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
