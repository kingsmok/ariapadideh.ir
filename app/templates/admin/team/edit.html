{% extends 'admin/base.html' %}

{% block page_title %}{{ 'ویرایش عضو تیم' if member else 'افزودن عضو تیم' }}{% endblock %}

{% block admin_content %}
<div style="max-width:720px; margin:0 auto;" class="glass-card">
    <div style="padding:1.5rem 2rem;">
        <h2 style="font-size:1.25rem; font-weight:800; color:var(--text-white); margin:0 0 1.5rem;">
            {{ '✏️ ویرایش: ' + member.full_name if member else '➕ عضو جدید تیم' }}
        </h2>

        <form action="{{ url_for('admin.team_edit', member_id=member.id if member else None) }}" method="POST" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

            <div style="margin-bottom:1rem;">
                <label class="form-label" style="color:var(--text-white); font-size:.85rem;">نام و نام خانوادگی *</label>
                <input type="text" name="full_name" class="form-control" required value="{{ member.full_name if member else '' }}">
            </div>

            <div style="margin-bottom:1rem;">
                <label class="form-label" style="color:var(--text-white); font-size:.85rem;">سمت</label>
                <input type="text" name="role_title" class="form-control" value="{{ member.role_title or '' if member else '' }}" placeholder="مثلاً: مدیر فنی">
            </div>

            <div style="margin-bottom:1rem;">
                <label class="form-label" style="color:var(--text-white); font-size:.85rem;">آواتار (URL تصویر)</label>
                <input type="text" name="avatar" class="form-control" dir="ltr" value="{{ member.avatar or '' if member else '' }}" placeholder="/static/uploads/team/...">
            </div>

            <div style="margin-bottom:1rem;">
                <label class="form-label" style="color:var(--text-white); font-size:.85rem;">بیوگرافی کوتاه</label>
                <textarea name="bio" class="form-control" rows="3">{{ member.bio or '' if member else '' }}</textarea>
            </div>

            <div style="margin-bottom:1rem;">
                <label class="form-label" style="color:var(--text-white); font-size:.85rem;">مهارت‌ها — هر خط: <code dir="ltr">نام:درصد</code></label>
                <textarea name="skills" class="form-control" rows="4" dir="rtl" placeholder="Python:95&#10;Flask:90&#10;DevOps:75">{% if member %}{% for s in member.skill_list() %}{{ s.name }}:{{ s.level }}{% if not loop.last %}
{% endif %}{% endfor %}{% endif %}</textarea>
                <small style="color:var(--text-gray-400);">نوار مهارت خطی در سایت نمایش داده می‌شود.</small>
            </div>

            <div class="row g-2" style="margin-bottom:1rem;">
                <div class="col-6">
                    <label class="form-label" style="color:var(--text-white); font-size:.85rem;">اینستاگرام</label>
                    <input type="text" name="social_instagram" class="form-control" dir="ltr" value="{{ member.socials.instagram if member and member.socials else '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label" style="color:var(--text-white); font-size:.85rem;">لینکدین</label>
                    <input type="text" name="social_linkedin" class="form-control" dir="ltr" value="{{ member.socials.linkedin if member and member.socials else '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label" style="color:var(--text-white); font-size:.85rem;">تلگرام</label>
                    <input type="text" name="social_telegram" class="form-control" dir="ltr" value="{{ member.socials.telegram if member and member.socials else '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label" style="color:var(--text-white); font-size:.85rem;">ایمیل</label>
                    <input type="email" name="social_email" class="form-control" dir="ltr" value="{{ member.socials.email if member and member.socials else '' }}">
                </div>
            </div>

            <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1.5rem;">
                <div>
                    <label class="form-label" style="color:var(--text-white); font-size:.85rem;">ترتیب</label>
                    <input type="number" name="sort_order" class="form-control" style="width:100px;" value="{{ member.sort_order if member else 0 }}">
                </div>
                <label style="color:var(--text-white); font-size:.85rem; display:flex; gap:.4rem; align-items:center; margin-top:1rem;">
                    <input type="checkbox" name="is_active" value="1" {{ 'checked' if (member and member.is_active) or not member else '' }}> فعال
                </label>
            </div>

            <button type="submit" class="btn-rahsa-cta" style="padding:.65rem 1.6rem;">ذخیره</button>
            <a href="{{ url_for('admin.team') }}" class="btn-rahsa-outline" style="padding:.65rem 1.2rem;">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
