{% extends 'admin/base.html' %}

{% block page_title %}{{ 'ویرایش اسلایدر' if slider else 'ایجاد اسلایدر' }}{% endblock %}

{% block admin_content %}
<div style="padding:2rem; max-width:600px; margin:0 auto;" class="glass-card">
    <h2 style="font-size:1.4rem; font-weight:800; color:var(--text-white); margin-bottom:1.5rem; border-bottom:2px solid var(--glass-border); padding-bottom:1rem;">
        {{ 'ویرایش اسلایدر ' ~ slider.title if slider else 'ایجاد اسلایدر جدید' }}
    </h2>

    <form action="{{ url_for('admin.slider_edit', slider_id=slider.id) if slider else url_for('admin.slider_edit') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
        <div class="mb-3">
            <label class="form-label-rahsa">عنوان اسلایدر *</label>
            <input type="text" name="title" class="form-control-rahsa" value="{{ slider.title if slider else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label-rahsa">موقعیت</label>
            <input type="text" name="position" class="form-control-rahsa" value="{{ slider.position if slider else 'home' }}">
        </div>
        <button type="submit" class="btn-rahsa-cta btn-lg w-100 mt-3">💾 ذخیره اسلایدر</button>
    </form>
</div>
{% endblock %}
